interface:
  display_name: "Beautiful HTML"
  short_description: "Turn notes, summaries, or long-form text into a single self-contained, publication-grade static HTML manual using preset skeletons or bespoke editorial styling."
  default_prompt: "Use $beautiful-html to turn my content into a publication-grade single-file HTML manual: choose a fitting preset or bespoke editorial style, preserve all content across varied section layouts, and verify with verify-html.py and a browser check."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
  activation:
    mode: "manual-or-description"
    paths:
      - "SKILL.md"
  execution:
    context: "inline"
    shell: "bash"
    browser_verification: "recommended"
  trust:
    source_tier: "local"
    network_policy: "allow-google-fonts-cdn-only"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    no_network: "use local or system font stacks in CSS tokens and note when web fonts are omitted"
    no_browser: "run scripts/verify-html.py and report that live browser/screenshot verification was unavailable"
    generic: "neutral-source"
