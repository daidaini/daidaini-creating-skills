interface:
  display_name: "Beautiful HTML"
  short_description: "Generate a design-conscious, single-file static HTML knowledge manual with magazine-grade typography, offset shadows, rotated sticker badges, hollow chapter numbers, sidebar TOC, and mixed content components — avoiding the generic AI template look"
  default_prompt: "Use $beautiful-html to turn my long content into a designed, flip-through static HTML manual: pick a style preset, plan chapters that preserve all information, build the page from the skeleton template, then run the checklist verification and a browser check with a screenshot."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
  activation:
    mode: "manual-or-description"
    paths:
      - "SKILL.md"
      - "references/design-system.md"
      - "references/style-presets.md"
      - "references/component-library.md"
  execution:
    context: "inline"
    shell: "bash"
    browser_verification: "recommended"
  trust:
    source_tier: "local"
    network_policy: "allow-google-fonts-cdn-only"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    no_network: "keep the structure and design tokens; state that Google Fonts will fall back to system fonts until network is available, or embed local @font-face files if the user needs fully offline output"
    no_browser: "run scripts/verify-html.py for the static checklist and mark visual/screenshot evidence as unavailable"
    generic: "neutral-source"
