interface:
  display_name: "Geographic Map Artifact"
  short_description: "Verified local route, choropleth and composite maps"
  default_prompt: "Use $geographic-map-artifact: preflight supplied data, choose D3/Leaflet, verify in a browser, deliver a folder or explicit single HTML."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets: ["openai", "claude", "generic"]
  activation:
    mode: "manual-or-description"
    paths: ["SKILL.md"]
  execution:
    context: "inline"
    shell: "powershell"
  trust:
    source_tier: "local"
    network_policy: "requested acquisition only; runtime network depends on basemap"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "use available browser; label unavailable evidence"
    claude: "use available browser; label unavailable evidence"
    generic: "static checks if no browser; no verified visual claim"
    no_network: "reuse supplied data/cached libraries; vector-only rendering"
contract:
  triggers: ["绘制路线图", "省份着色地图", "离线地图", "合成地图", "route map", "choropleth"]
  inputs: ["known-WGS84 geography", "values", "source/date/synthetic", "delivery/network needs"]
  outputs: ["folder or explicit single HTML", "verification/README", "optional KML"]
  exclusions: ["live GIS", "skill audit", "regulated publication", "unsupported precision"]
  mode: "scaffold"
