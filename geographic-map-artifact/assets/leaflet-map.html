<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>地图</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>body{margin:0;padding:16px;font-family:system-ui,sans-serif;background:#fafafa;color:#20252b}main{max-width:1000px;margin:auto}#map{height:65vh;min-height:320px}p{line-height:1.6;color:#58636d}#legend{display:flex;gap:12px;flex-wrap:wrap}#error{color:#b91c1c}</style></head>
<body><main><h1 id="title"></h1><p id="source"></p><p id="error" role="alert"></p><div id="map"></div><p id="stats"></p><div id="legend"></div></main>
<script src="vendor/leaflet/leaflet.js"></script><script src="data.js"></script><script>
try {
 const data=window.MAP_DATA;if(!data||!window.L)throw new Error('Missing preflight data or local Leaflet');
 document.querySelector('#title').textContent=data.meta.title||'地图';document.title=data.meta.title||'地图';
 const online=data.meta.basemap==='osm';
 document.querySelector('#source').textContent=data.meta.source+' · '+data.meta.date+(data.meta.synthetic?' · 示意数据':'')+(online?' · 底图需要联网':' · 离线矢量图');
 const map=L.map('map'), layers=L.featureGroup().addTo(map);
 if(online)L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(map);
 const nums=Object.values(data.values).filter(Number.isFinite),min=nums.length?Math.min(...nums):0,max=nums.length?Math.max(...nums):1;
 const color=v=>{const t=max===min ? 0.5 : (v-min)/(max-min);return 'hsl(210,65%,'+(92-55*t)+'%)';};
 const val=f=>Object.prototype.hasOwnProperty.call(data.values,f.properties[data.valueProperty])?data.values[f.properties[data.valueProperty]]:null;
 const popup=text=>{const element=document.createElement('span');element.textContent=text;return element;};
 L.geoJSON(data.regions,{style:f=>({className:'map-region',color:'#fff',weight:1,fillOpacity:.8,fillColor:val(f)==null?'#d1d5db':color(val(f))}),onEachFeature:(f,l)=>l.bindPopup(popup(f.properties[data.valueProperty]+': '+(val(f)==null?'无数据':val(f))))}).addTo(layers);
 data.routes.forEach(r=>L.geoJSON(r.geometry,{style:{className:'map-route',color:r.color||'#e76f51',weight:4},onEachFeature:(f,l)=>l.bindPopup(popup(r.name||'路线'))}).addTo(layers));
 data.points.forEach(p=>L.circleMarker(L.GeoJSON.coordsToLatLng(p.coordinates),{className:'map-point',radius:6,color:'#fff',weight:2,fillColor:'#20252b',fillOpacity:1}).bindPopup(popup(p.name||'点位')).addTo(layers));
 const bounds=layers.getBounds();function fit(){if(bounds.isValid()){if(bounds.getSouthWest().equals(bounds.getNorthEast()))map.setView(bounds.getCenter(),10);else map.fitBounds(bounds,{padding:[24,24],animate:false});}}fit();map.on('resize',fit);
 const stats=data.routes.map(r=>[r.name||'路线',r.distanceMeters==null?null:(r.distanceMeters/1000).toFixed(1)+' km',r.durationSeconds==null?null:Math.round(r.durationSeconds/60)+' min'].filter(Boolean).join(' · '));document.querySelector('#stats').textContent=stats.join(' / ');
 function legend(text,fill){const el=document.createElement('span'),swatch=document.createElement('span');swatch.textContent='■ ';swatch.style.color=fill;el.append(swatch,document.createTextNode(text));document.querySelector('#legend').append(el);}
 if(data.regions.features.length){if(nums.length){legend((data.meta.metric||'数值')+': '+min,color(min));if(max!==min)legend(String(max),color(max));}if(data.regions.features.some(f=>val(f)==null))legend('无数据','#6b7280');}
 data.routes.forEach(r=>legend(r.name||'路线',r.color||'#e76f51'));if(data.points.length)legend('点位','#20252b');
 window.MAP_RENDER={map,bounds,color};
}catch(error){document.querySelector('#error').textContent=error.message;throw error;}
</script></body></html>
