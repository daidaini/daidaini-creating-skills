# attends_court skill interface
# Generated per yao-meta-skill package conventions

name: attends_court
description: |
  Court-deliberation framework modeled on Northern Song dynasty state discussions.
  A chancellor hosts round-by-round clashes among figures from any era or culture on any topic.

trigger_mode: keyword
triggers:
  - "朝议"
  - "廷议"
  - "朝堂讨论"
  - "皇上"

entrypoint: SKILL.md

inputs:
  - type: text
    description: User's topic or question for court deliberation
    examples:
      - "朝议，怎么看待 AI 对教育体系的冲击？"
      - "朝议：我在大厂做了八年后端，35 岁，该不该辞职去做独立开发？"

outputs:
  - type: interactive_dialogue
    description: Multi-round court deliberation with sharp stance clashes, solo 召对, and pause-for-input flow
  - type: markdown_file
    path: "./议事-{topic_keywords}.md"
    description: Full deliberation record, written only if 皇上 approves at closing

output_contract:
  - "Round 1 casts 3-5 opposing figures who push their stances without hedging; later rounds summon only relevant figures to clash or answer solo 召对"
  - "After each round, 宰相 pinpoints the real fault line (or asks 皇上 for decisive missing context) and pauses"
  - "Closing delivers 宰相断案 and open questions, adding a table or diagram only when complex relationships warrant it"
  - "宰相 asks whether to archive; record saved to markdown only on approval"

exclusions:
  - "Straightforward Q&A or summary without role-based deliberation"

mode: production
