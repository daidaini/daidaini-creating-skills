name: content-to-zen-static-html
mode: scaffold
triggers:
  - 单文件 HTML、离线 HTML、静态 HTML 页面、长文转网页
  - convert Markdown to standalone HTML / single-file HTML
inputs:
  - Markdown、纯文本、结构化资料、用户提供的长文档
outputs:
  - 全文内嵌、CSS/JS 内联、file 协议可打开的单个 HTML
exclusions:
  - 网页片段或组件
  - 需要后端服务的动态站点、多文件工程
  - HTML 邮件模板
workflow:
  - 优先 render.py --markdown；需重组时 render.py --model
  - 脚本复用模板并执行静态检查，成功且未修改时不重复检查
  - 真实浏览器验证离线、搜索、分类、锚点、主题与移动端
