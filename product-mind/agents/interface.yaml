# product_mind skill interface

name: product_mind
description: |
  Decisive product judgment: evaluates whether something is worth building (GO / NO-GO),
  who it serves, how it beats existing workarounds, where to cut the MVP, and how to falsify assumptions cheaply.

trigger_mode: keyword-or-intent
triggers:
  - "#product"
  - "#pm"
  - "从产品视角看"
  - "这个需求值不值得做"
  - "帮我梳理需求"
  - "帮我做 PRD"
  - "这个功能要不要上"

entrypoint: SKILL.md

inputs:
  - type: text
    description: Product idea, feature request, prioritization dilemma, or MVP/PRD scoping question
    examples:
      - "#product 我们想给记账 App 增加 AI 自动分类，值不值得做？"
      - "帮我定义共享待办 App 的首版 MVP 范围"
      - "#product 先做 Web 还是先做 App？"

outputs:
  - type: structured_response
    description: Decisive product verdict tailored to the question type (GO/NO-GO evaluation, MVP/PRD cut, or trade-off ranking)
  - type: markdown_file
    path: "./{topic}_prd.md"
    description: Optional PRD markdown file written only when requested

output_contract:
  - "Peel back proposed solutions to real user, concrete moment of pain, and existing workarounds"
  - "Deliver a clear GO / NO-GO / narrowed-MVP verdict without fence-sitting"
  - "Protect MVP focus by explicitly stating what NOT to build yet"
  - "Use behavioral, time-bounded, falsifiable metrics without fabricating baseline numbers, plus a low-cost validation test and reversal condition"

exclusions:
  - "Pure code implementation details, syntax/library debugging, or bug fixes"

mode: production
