# One-Page Cheat Sheet — Agent Interface
# Generated by yao-meta-skill optimization
# Schema: skill-agent-interface v1

name: one-page-cheat-sheet
version: 2.0.0
description: "Generate a one-page cheat sheet for any topic"
maturity: production

triggers:
  positive:
    - "cheat sheet"
    - "速查表"
    - "quick reference"
    - "复习资料"
    - "cram sheet"
    - "备忘录"
    - "知识点总结"
    - "面试准备"
    - "考前速览"
    - "one-pager"
    - "study guide"
    - "记忆卡"
    - "帮我整理一下重点"
    - "给我一个浓缩版"
    - "整理重点"
  negative:
    - "deep dive"
    - "comprehensive tutorial"
    - "learning path"
    - "step by step tutorial"
    - "详细教程"
    - "系统学习"
  near_neighbors:
    - query: "explain [topic]"
      action: "not a cheat sheet request — route to general Q&A"
    - query: "teach me [topic]"
      action: "learning path, not cheat sheet — route to build-learning-ladder"
    - query: "what is [term]"
      action: "single definition lookup — route to search"
    - query: "compare [X] and [Y]"
      action: "comparison, not cheat sheet — may need sibling skill"

inputs:
  topic:
    type: string
    description: "The topic to create a cheat sheet for"
    required: true
    constraints:
      - "must be scoped enough to fit one page"
      - "if too broad, ask user to narrow down"

outputs:
  primary:
    type: markdown_file
    path: "{topic-slug}_cheat_sheet.md"
    description: "The one-page cheat sheet markdown file"
  structure:
    sections:
      - "1. What It Is (In One Sentence)"
      - "2. Core Concepts / Rules / Formulas"
      - "3. Visual Reference"
      - "4. Real-World Examples"
      - "5. Common Mistakes & Confusions"
      - "6. Before You Use This — Checklist"
      - "7. Rapid-Fire Questions (Test Yourself)"
      - "8. One More Thing"
  quality_gates:
    - "fits on one printed page"
    - "at least one visual element"
    - "3-5 concrete examples"
    - "3-4 real beginner mistakes"
    - "bullets, not paragraphs"

resources:
  references:
    - "references/output-template.md"
    - "references/best-practices.md"
